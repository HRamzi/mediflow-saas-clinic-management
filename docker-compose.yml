
services:

  # PHP-FPM — Laravel application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediflow_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - mediflow_network
    depends_on:
      - mysql
      - redis

  # Nginx — web server
  nginx:
    image: nginx:1.25
    container_name: mediflow_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - mediflow_network
    depends_on:
      - app

  # MySQL — database
  mysql:
    image: mysql:8.4
    container_name: mediflow_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mediflow_mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - mediflow_network

  # Redis — caching and queues
  redis:
    image: redis:7.2
    container_name: mediflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - mediflow_network

networks:
  mediflow_network:
    driver: bridge

volumes:
  mediflow_mysql_data:
    driver: local